<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L1FE / AWAKEN 014</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040918;color:#d4edff;font:12px/1.6 ui-monospace,monospace}canvas{width:100%;height:100%;display:block;cursor:crosshair}.ui{position:fixed;top:16px;left:16px;width:min(340px,calc(100vw - 32px));padding:17px;border:1px solid #5aaaff55;border-radius:9px;background:#061329dc;backdrop-filter:blur(16px);max-height:calc(100vh - 32px);overflow:auto}.hidden .ui{display:none}.sub{font-size:10px;color:#79baff;letter-spacing:.23em}h1{font-weight:400;font-size:19px;margin:4px 0 7px}button,select{background:#10233e;color:#dbecff;border:1px solid #335b82;border-radius:4px;padding:8px;margin:3px;cursor:pointer;font:inherit}button:hover{background:#214268}select{width:96%}.hint{color:#86a9cb;font-size:11px}.stats{border-top:1px solid #325373;margin-top:14px;padding-top:10px;color:#bce4fe}</style></head><body><canvas id="screen"></canvas><div class="ui"><div class="sub">L1FE / EXPERIMENT 014</div><h1>THE POSSIBILITY ENGINE</h1><p>Worlds dreaming of different physical laws.</p><button id="discover">DISCOVER 24 WORLDS</button><button id="mutate">MUTATE LAWS</button><button id="reset">ORIGIN</button><button id="full">FULLSCREEN</button><button id="hide">HIDE UI</button><button id="save">EXPORT DISCOVERIES</button><p class="hint">Discovered niches</p><select id="niches"><option value="-1">ORIGIN PHYSICS</option></select><p class="hint">Visual instrument</p><select id="mode"><option value="truth">TRUE FIELDS</option><option value="dream">DREAM ROT</option><option value="ghost">MEMORY GHOST</option><option value="signal">SIGNAL DEATH</option></select><p class="hint">Gesture: paint a material onto the world</p><select id="brush"><option value="charge">CHARGE</option><option value="structure">STRUCTURE</option><option value="energy">ENERGY</option><option value="erase">ERASE</option></select><div class="stats" id="stats">INITIALIZING</div><p class="hint" id="status">F fullscreen · H hide · SPACE pause · 1–4 change instrument</p></div><script type="module">
import {SIZE,DEFAULT,createWorld,step,metrics,search,mutate,rng} from '../src/engine.mjs';
const $=x=>document.getElementById(x),canvas=$('screen'),ctx=canvas.getContext('2d',{alpha:false}),scratch=document.createElement('canvas'),sc=scratch.getContext('2d');scratch.width=scratch.height=SIZE;let world=createWorld(2026),archive=[],random=rng(901),mode='truth',brush='charge',paused=false,acc=0,last=performance.now(),frame=0;
function resize(){let dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr)}addEventListener('resize',resize);resize();
function draw(now){let s=world.size,im=sc.createImageData(s,s);for(let i=0;i<s*s;i++){let e=world.energy[i],q=world.charge[i],b=world.structure[i],r=world.residue[i],m=world.memory[i],x=i%s,y=(i/s)|0,R,G,B;if(mode==='dream'){let wave=.5+.5*Math.sin(x*.7+y*.34+now*.001+q*8);R=30+q*220+r*95;G=18+b*90+wave*65;B=65+e*175+m*80;}else if(mode==='ghost'){R=20+m*100;G=30+m*145;B=60+m*190;}else if(mode==='signal'){let v=q*225+b*75+Math.max(0,Math.sin(x*1.6+now*.006))*q*65;R=G=B=v;}else{R=12+q*230+r*75;G=18+b*180;B=32+e*170+q*60;}im.data[4*i]=Math.min(255,R);im.data[4*i+1]=Math.min(255,G);im.data[4*i+2]=Math.min(255,B);im.data[4*i+3]=255;}sc.putImageData(im,0,0);let side=Math.max(canvas.width,canvas.height)*1.01;ctx.fillStyle='#02050e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(scratch,(canvas.width-side)/2,(canvas.height-side)/2,side,side);}
function setPhysics(p){world=createWorld(2026,p);$('status').textContent='World forked under different physical laws.'}
$('discover').onclick=()=>{ $('status').textContent='Evaluating nested realities…';setTimeout(()=>{let result=search({generations:24,seed:Math.floor(random()*1e9),steps:60});archive=result.cells;$('niches').innerHTML='<option value="-1">ORIGIN PHYSICS</option>'+archive.map((x,i)=>'<option value="'+i+'">Niche '+x.cell+' · '+x.score.toFixed(4)+'</option>').join('');$('status').textContent=result.generations+' trials · '+archive.length+' distinct niches · '+result.accepted+' archive improvements';},20)};
$('mutate').onclick=()=>setPhysics(mutate(world.physics,random,.3));$('reset').onclick=()=>setPhysics(DEFAULT);$('niches').onchange=e=>setPhysics(e.target.value==='-1'?DEFAULT:archive[+e.target.value].physics);$('mode').onchange=e=>mode=e.target.value;$('brush').onchange=e=>brush=e.target.value;
function hide(){document.body.classList.toggle('hidden')}async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='Fullscreen denied by browser; H still hides the interface.'}}$('hide').onclick=hide;$('full').onclick=fullscreen;
$('save').onclick=()=>{let data={format:'AWAKEN-DISCOVERY-ARCHIVE',version:1,physics:world.physics,archive},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='awaken-014-discoveries.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let painting=false;function paint(ev){let rect=canvas.getBoundingClientRect(),side=Math.max(canvas.width,canvas.height)*1.01,px=(ev.clientX-rect.left)*canvas.width/rect.width,py=(ev.clientY-rect.top)*canvas.height/rect.height,x=Math.floor((px-(canvas.width-side)/2)/side*SIZE),y=Math.floor((py-(canvas.height-side)/2)/side*SIZE);if(x<0||y<0||x>=SIZE||y>=SIZE)return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){let xx=(x+dx+SIZE)%SIZE,yy=(y+dy+SIZE)%SIZE,i=yy*SIZE+xx,amt=.3*Math.max(0,1-Math.hypot(dx,dy)/3);if(brush==='erase'){world.charge[i]*=.75;world.structure[i]*=.75;world.energy[i]*=.75}else world[brush][i]=Math.min(1,world[brush][i]+amt)}}canvas.addEventListener('pointerdown',e=>{painting=true;canvas.setPointerCapture(e.pointerId);paint(e)});canvas.addEventListener('pointermove',e=>{if(painting)paint(e)});canvas.addEventListener('pointerup',()=>painting=false);canvas.addEventListener('pointercancel',()=>painting=false);
addEventListener('keydown',e=>{if(e.target?.matches('input,select,textarea'))return;if(e.key.toLowerCase()==='h')hide();if(e.key.toLowerCase()==='f')fullscreen();if(e.code==='Space'){paused=!paused;e.preventDefault()}if('1234'.includes(e.key)){$('mode').selectedIndex=+e.key-1;mode=$('mode').value}});
function loop(now){acc+=Math.min(80,now-last);last=now;while(!paused&&acc>=33.333){step(world);acc-=33.333}if(paused)acc=0;draw(now);if(frame++%16===0){let m=metrics(world);$('stats').textContent='TICK '+world.tick+' · CHARGE '+m.activity.toFixed(4)+' · VARIANCE '+m.variance.toFixed(4)+' · NICHES '+archive.length;}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
